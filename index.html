<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RETRO STACK</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cabinet" id="cabinet">
    <div class="title">RETRO <span>STACK</span></div>
    <div class="stage">
      <div class="board-wrap" id="board-wrap">
        <canvas id="board" width="240" height="480"></canvas>
        <div class="scanlines"></div>
        <div class="overlay-msg show" id="overlay">
          <h2 id="overlay-title">RETRO STACK</h2>
          <p id="overlay-sub">Pilih mode permainan</p>
          <div class="mode-buttons" id="mode-buttons">
            <button class="btn" id="mode-marathon">MARATHON</button>
            <button class="btn" id="mode-sprint">SPRINT 40</button>
          </div>
          <div class="result-buttons" id="result-buttons" style="display:none;">
            <button class="btn" id="restart-btn">MAIN LAGI</button>
            <button class="btn ghost" id="menu-btn">MENU</button>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <h3>HOLD</h3>
          <canvas id="hold-canvas" width="90" height="70"></canvas>
        </div>
        <div class="panel">
          <h3>STATISTIK</h3>
          <div class="stat-row"><span>MODE</span><b id="mode-label">MARATHON</b></div>
          <div class="stat-row"><span>SKOR</span><b id="score">0</b></div>
          <div class="stat-row"><span>TERTINGGI</span><b id="high">0</b></div>
          <div class="stat-row"><span>LEVEL</span><b id="level">1</b></div>
          <div class="stat-row"><span>BARIS</span><b id="lines">0</b></div>
          <div class="stat-row"><span>COMBO</span><b id="combo">-</b></div>
        </div>
        <div class="panel" id="sprint-panel" style="display:none;">
          <h3>SPRINT 40</h3>
          <div class="stat-row"><span>WAKTU</span><b id="sprint-time">00:00.00</b></div>
          <div class="stat-row"><span>TERBAIK</span><b id="sprint-best">-</b></div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <h3>BERIKUTNYA</h3>
          <canvas id="next-canvas" width="90" height="230"></canvas>
        </div>
        <div class="panel hint">
          <b>← →</b> geser &nbsp; <b>↓</b> turun cepat<br>
          <b>↑</b> putar &nbsp; <b>SPASI</b> jatuh instan<br>
          <b>C</b> tahan &nbsp; <b>P</b> jeda<br>
          <b>M</b> suara on/off
        </div>
      </div>
    </div>

    <div class="touch-controls">
      <div class="tc-group tc-move">
        <div class="tbtn" id="t-left">◀</div>
        <div class="tbtn" id="t-down">▼</div>
        <div class="tbtn" id="t-right">▶</div>
      </div>
      <div class="tc-group tc-action">
        <div class="tbtn wide" id="t-hold">HOLD</div>
        <div class="tbtn" id="t-rotate">⟳</div>
        <div class="tbtn wide" id="t-pause">JEDA</div>
        <div class="tbtn wide" id="t-drop">JATUH</div>
      </div>
    </div>
  </div>

<script src="game.js" defer></script>
</body>
</html>
